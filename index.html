<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Notes Service</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7"
      crossorigin="anonymous"
    />
    
  </head>
  <body style="background:hsla(270, 50%, 40%, 0.181);">
    <div class="container mt-5">
      <h1 class="mb-4" style=" width: 100%;
    text-align: center; font-size: 3rem;">My Notes</h1>
      <form id="noteForm" class="mb-4">
        <div class="mb-3">
          <input
            type="text"
            id="title"
            class="form-control"
            placeholder="Note title"
            required
          />
        </div>
        <div class="mb-3">
          <textarea
            class="form-control"
            id="content"
            rows="3"
            placeholder="Note content"
            required
          ></textarea>
        </div>
        <button type="submit" class="btn btn-primary">Add Note</button>
      </form>

      <div id="notes" class="mt-3"></div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
